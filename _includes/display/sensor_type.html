<tr>
  <th>{{ include.field.label }}</th>
  <td>
    {% if include.value.size %}
      {% for val in include.value %}
        <a href="{{ site.baseurl }}/datasets/?data_type_facet={{ val | slugify }}">{{ val }}</a>{% unless forloop.last %}, {% endunless %}
      {% endfor %}
    {% else %}
      <a href="{{ site.baseurl }}/datasets/?data_type_facet={{ include.value | slugify }}">{{ include.value }}</a>
    {% endif %}
  </td>
